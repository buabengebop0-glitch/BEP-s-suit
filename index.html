<!DOCTYPE html>
<html>
<head>
    <title>BEP's Suit Luxury Store</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            background: black;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid gold;
        }

        header h1 {
            color: gold;
            margin: 0;
        }

        nav {
            background: #222;
            text-align: center;
            padding: 10px;
        }

        nav a {
            color: white;
            margin: 15px;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: gold;
        }

        .hero {
            background: url("https://images.unsplash.com/photo-1520975922284-9c0f0a4a2f9b");
            background-size: cover;
            background-position: center;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero h2 {
            background: rgba(0,0,0,0.6);
            padding: 20px;
            color: gold;
        }

        .products {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 30px;
            flex-wrap: wrap;
        }

        .card {
            background: #222;
            border: 1px solid gold;
            border-radius: 10px;
            width: 220px;
            text-align: center;
            padding: 10px;
        }

        .card img {
            width: 100%;
            border-radius: 10px;
        }

        .card h3 {
            color: gold;
        }

        .contact {
            background: black;
            padding: 20px;
            text-align: center;
            border-top: 2px solid gold;
        }

        footer {
            text-align: center;
            padding: 10px;
            background: #000;
        }

    </style>

</head>

<body>

<header>
    <h1>BEP's Suit Luxury Store</h1>
    <p>Luxury & Affordable Suits</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="#">Contact</a>
</nav>

<div class="hero">
    <h2>Luxury Suits For Every Occasion</h2>
</div>

<div class="products">

    <div class="card">
        <img src="https://images.unsplash.com/photo-1593032465175-481ac7f401f0">
        <h3>Black Suit</h3>
        <p>$120</p>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1520975922284-9c0f0a4a2f9b">
        <h3>Blue Suit</h3>
        <p>$140</p>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1617127365659-c47fa864d8bc">
        <h3>White Suit</h3>
        <p>$150</p>
    </div>

</div>

<div class="contact">
    <h2>Contact Us</h2>
    <p>Phone: 0550000000</p>
    <p>Email: bepsuit@gmail.com</p>
</div>

<footer>
    <p>© 2026 BEP's Suit Luxury Store</p>
</footer>

</body>
</html>
